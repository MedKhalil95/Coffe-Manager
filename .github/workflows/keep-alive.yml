name: Keep Render App Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          echo "Pinging Render app..."
          curl -s -o /dev/null -w "Response: %{http_code}\n" https://coffe-manager.onrender.com
          
      - name: Log timestamp
        run: |
          echo "Ping completed at $(date)"