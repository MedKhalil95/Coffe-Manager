services:
  - type: web
    name: coffee-manager
    env: python
    region: oregon
    plan: free
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        value: "super-secret-production-key"
      - key: DATABASE_URL
        fromDatabase: coffee-manager-db

  - type: postgresql
    name: coffee-manager-db
    plan: free
    envVars:
      - key: DATABASE_URL
        value: "postgres://user:password@hostname:5432/dbname"
