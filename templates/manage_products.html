<!DOCTYPE html>
<html>
<head>
    <title>Manage Products</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .nav { margin: 20px 0; }
        .nav a { margin-right: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        .form-container { background: #f5f5f5; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Manage Products</h1>
<!-- In manage_products.html, update the nav section -->
<div class="nav">
    <a href="{{ url_for('admin_dashboard') }}">← Back to Dashboard</a>
    <a href="{{ url_for('logout') }}">Logout</a>
    <span style="float: right; color: #666;">{{ current_user.username }}</span>
</div>
    <div class="form-container">
        <h3>Add/Edit Product</h3>
        <form method="post">
            <input type="hidden" name="product_id" id="product_id">
            <input type="text" name="name" id="name" placeholder="Product Name" required>
            <input type="number" step="0.01" name="price" id="price" placeholder="Selling Price" required>
            <input type="number" step="0.01" name="cost_price" id="cost_price" placeholder="Cost Price">
            <input type="number" name="stock" id="stock" placeholder="Initial Stock">
            <button type="submit">Save Product</button>
        </form>
    </div>

    <h2>Existing Products</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Cost</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td>
            <td>${{ "%.2f"|format(p.price) }}</td>
            <td>${{ "%.2f"|format(p.cost_price) }}</td>
            <td>{{ p.stock }}</td>
            <td>
                <button onclick="editProduct({{ p.id }}, '{{ p.name }}', {{ p.price }}, {{ p.cost_price }}, {{ p.stock }})">
                    Edit
                </button>
                <a href="{{ url_for('delete_product', id=p.id) }}" onclick="return confirm('Delete this product?')">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <script>
        function editProduct(id, name, price, cost_price, stock) {
            document.getElementById('product_id').value = id;
            document.getElementById('name').value = name;
            document.getElementById('price').value = price;
            document.getElementById('cost_price').value = cost_price;
            document.getElementById('stock').value = stock;
        }
    </script>
</body>
</html>
