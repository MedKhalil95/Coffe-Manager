{% extends "base.html" %}
{% block content %}
<h4>Fixed Costs</h4>

<form method="POST" class="row g-3 mb-4">
    <div class="col-md-6">
        <label class="form-label">Cost Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Amount (DT)</label>
        <input type="number" step="0.01" name="amount" class="form-control" required>
    </div>
    <div class="col-12">
        <button class="btn btn-success">Add Cost</button>
    </div>
</form>

<table class="table table-striped shadow">
    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Amount (DT)</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for cost in fixed_costs %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ cost.name }}</td>
            <td>{{ cost.amount }}</td>
            <td>{{ cost.date.strftime('%d-%m-%Y') }}</td>
            <td>
                <a href="{{ url_for('costs.edit_cost', cost_id=cost.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{{ url_for('costs.delete_cost', cost_id=cost.id) }}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete {{ cost.name }}?');">Delete</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-center">No costs yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
