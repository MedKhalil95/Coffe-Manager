{% extends "base.html" %}
{% block content %}
<h4>Recipe: {{ product.name }}</h4>

<form method="POST" class="row g-3 mb-4">
    <div class="col-md-6">
        <label class="form-label">Ingredient</label>
        <select name="ingredient_id" class="form-select" required>
            {% for ing in ingredients %}
            <option value="{{ ing.id }}">{{ ing.name }} (Unit cost: {{ ing.unit_cost }} DT)</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-6">
        <label class="form-label">Qty used per product</label>
        <input type="number" step="0.01" name="qty_used" class="form-control" required>
    </div>
    <div class="col-12">
        <button class="btn btn-success">Add/Update Ingredient</button>
        <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">Back</a>
    </div>
</form>

<h5>Current Recipe:</h5>
<table class="table table-striped">
    <thead>
        <tr>
            <th>#</th>
            <th>Ingredient</th>
            <th>Qty Used</th>
        </tr>
    </thead>
    <tbody>
        {% for r in recipe %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ r.ingredient.name }}</td>
            <td>{{ r.qty_used }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center">No ingredients yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
