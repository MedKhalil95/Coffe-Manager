{% extends "base.html" %}
{% block content %}
<h4>Edit Cost</h4>
<form method="POST" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Name</label>
        <input type="text" name="name" value="{{ cost.name }}" class="form-control" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Amount (DT)</label>
        <input type="number" step="0.01" name="amount" value="{{ cost.amount }}" class="form-control" required>
    </div>
    <div class="col-12">
        <button class="btn btn-success">Save</button>
        <a href="{{ url_for('costs.list_costs') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
